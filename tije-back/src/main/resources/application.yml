spring:
  application:
    name: tije-back
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tijetravel}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TIJESESSION
        http-only: true
        same-site: lax

app:
  seguridad:
    origen-frontend: ${FRONTEND_ORIGIN:http://localhost:5173}
    administrador-inicial:
      habilitado: ${APP_ADMIN_ENABLED:false}
      nombre-usuario: ${APP_ADMIN_USERNAME:}
      contrasenia: ${APP_ADMIN_PASSWORD:}
