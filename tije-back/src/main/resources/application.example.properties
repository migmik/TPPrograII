spring.application.name=tije-back
spring.profiles.active=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tijetravel}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.seguridad.origen-frontend=${FRONTEND_ORIGIN:http://localhost:5173}
app.seguridad.administrador-inicial.habilitado=${APP_ADMIN_ENABLED:false}
app.seguridad.administrador-inicial.nombre-usuario=${APP_ADMIN_USERNAME:}
app.seguridad.administrador-inicial.contrasenia=${APP_ADMIN_PASSWORD:}
